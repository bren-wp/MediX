name: Discover eLijekovi endpoints

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/full-android-v0.2.0"
    paths:
      - "tool/discover_elijekovi.py"
      - ".github/workflows/discover-elijekovi.yml"

permissions:
  contents: write

concurrency:
  group: medix-elijekovi-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Discover public endpoints
        run: python tool/discover_elijekovi.py

      - name: Commit discovery report
        run: |
          if git diff --quiet -- docs/ELIJEKOVI_DISCOVERY.md; then
            echo "Discovery report unchanged."
            exit 0
          fi
          git config user.name "MediX Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ELIJEKOVI_DISCOVERY.md
          git commit -m "docs: refresh eLijekovi endpoint discovery"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
