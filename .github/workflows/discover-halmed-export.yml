name: Discover HALMED medicine export

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/medix-pro-v0.3.1"
    paths:
      - "tool/discover_halmed_export.py"
      - ".github/workflows/discover-halmed-export.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Discover HALMED export
        run: python tool/discover_halmed_export.py
