name: Sync medical classifications

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 1 * *"
  push:
    branches:
      - "feat/medix-pro-v0.3.0"
    paths:
      - "tool/sync_mkb10.py"
      - ".github/workflows/sync-classifications.yml"

permissions:
  contents: write

concurrency:
  group: medix-classification-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Synchronize MKB-10
        run: python tool/sync_mkb10.py --minimum-records 1000

      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("assets/data/icd10.json").read_text(encoding="utf-8"))
          count = len(data.get("records", []))
          assert count >= 1000, count
          print(f"Validated MKB-10: {count} records")
          PY

      - name: Commit refreshed registry
        run: |
          if git diff --quiet -- assets/data/icd10.json; then
            echo "MKB-10 registry is already current."
            exit 0
          fi
          git config user.name "MediX Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/icd10.json
          git commit -m "data: refresh MKB-10 registry"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
