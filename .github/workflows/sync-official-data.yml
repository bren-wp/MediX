name: Sync official medicine data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - "feat/full-android-v0.2.0"
    paths:
      - "tool/sync_hzzo_catalog.py"
      - "tool/sync_halmed_prices.py"
      - ".github/workflows/sync-official-data.yml"

permissions:
  contents: write

concurrency:
  group: medix-official-data-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Build official medicine catalogs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Synchronize HZZO catalog
        run: python tool/sync_hzzo_catalog.py --minimum-records 1000

      - name: Synchronize HALMED 2026 prices
        run: python tool/sync_halmed_prices.py --minimum-records 1000

      - name: Validate generated catalogs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalogs = {
              "HZZO": ("assets/data/medications_official.json", 1000),
              "HALMED": ("assets/data/halmed_prices_2026.json", 1000),
          }
          for label, (filename, minimum) in catalogs.items():
              data = json.loads(Path(filename).read_text(encoding="utf-8"))
              count = len(data.get("records", []))
              assert count >= minimum, (label, count)
              print(f"Validated {label}: {count} records")
          PY

      - name: Commit refreshed official data
        run: |
          if git diff --quiet --             assets/data/medications_official.json             assets/data/halmed_prices_2026.json; then
            echo "Official catalogs are already current."
            exit 0
          fi

          git config user.name "MediX Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add             assets/data/medications_official.json             assets/data/halmed_prices_2026.json
          git commit -m "data: refresh official medicine catalogs"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
