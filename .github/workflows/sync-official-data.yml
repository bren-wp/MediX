name: Sync official medicine data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
      - "feat/medix-pro-v*"
    paths:
      - "tool/sync_halmed_catalog.py"
      - "tool/sync_hzzo_catalog.py"
      - "tool/sync_halmed_prices.py"
      - "tool/validate_catalogs.py"
      - ".github/workflows/sync-official-data.yml"

permissions:
  contents: write

concurrency:
  group: medix-official-data-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Build verified medicine catalogs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl

      - name: Synchronize HALMED human-medicine registry
        run: python tool/sync_halmed_catalog.py --minimum-records 4000

      - name: Synchronize HZZO reimbursement enrichment
        run: python tool/sync_hzzo_catalog.py --minimum-records 500

      - name: Synchronize 2026 wholesale prices
        run: python tool/sync_halmed_prices.py --minimum-records 1000

      - name: Validate catalogs and build quality report
        run: python tool/validate_catalogs.py --report docs/DATA_QUALITY_REPORT.md

      - name: Commit refreshed verified data
        run: |
          tracked=(
            assets/data/halmed_catalog.json
            assets/data/medications_official.json
            assets/data/halmed_prices_2026.json
            docs/DATA_QUALITY_REPORT.md
          )

          if git diff --quiet -- "${tracked[@]}"; then
            echo "Official catalogs are already current."
            exit 0
          fi

          git config user.name "MediX Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${tracked[@]}"
          git commit -m "data: refresh verified medicine catalogs"
          git push origin HEAD:"${GITHUB_REF_NAME}"
