name: Sync official medicine data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - "feat/full-android-v0.2.0"
    paths:
      - "tool/sync_hzzo_catalog.py"
      - ".github/workflows/sync-official-data.yml"

permissions:
  contents: write

concurrency:
  group: medix-official-data-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Build HZZO catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Synchronize HZZO catalog
        run: python tool/sync_hzzo_catalog.py --minimum-records 1000

      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("assets/data/medications_official.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          count = len(data.get("records", []))
          assert count >= 1000, count
          print(f"Validated {count} official HZZO records")
          PY

      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- assets/data/medications_official.json; then
            echo "Official catalog is already current."
            exit 0
          fi
          git config user.name "MediX Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/medications_official.json
          git commit -m "data: refresh official HZZO medicine catalog"
          git push origin HEAD:"${GITHUB_REF_NAME}"
